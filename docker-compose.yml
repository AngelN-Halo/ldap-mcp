services:
  idm-mcp:
    build: .
    user: "10001:10001"
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./certs:/certs:ro
